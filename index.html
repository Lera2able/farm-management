    <style>
        :root { --navy:#15233f; --navy2:#1e3358; --gold:#c0962f; --cream:#f7f3ea; --ink:#2a2f3a; --muted:#6b7280; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: radial-gradient(120% 80% at 50% 0%, #fffdf8 0%, var(--cream) 60%, #efe7d6 100%);
            color: var(--ink); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 28px 20px; text-align: center;
        }
        .wrap { width: 100%; max-width: 460px; }
        .logo { width: 100%; max-width: 320px; height: auto; margin: 0 auto 6px; display: block; }
        .tagline { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-family: Arial, Helvetica, sans-serif; font-weight: 700; margin-top: 4px; }
        .home { font-size: 19px; color: var(--navy); margin: 20px 0 26px; font-style: italic; }
        .enter {
            display: inline-flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; border: none; cursor: pointer;
            font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .3px;
            padding: 15px 30px; border-radius: 10px; box-shadow: 0 6px 18px rgba(21,35,63,.25);
            transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
        }
        .enter:hover { background: var(--navy2); transform: translateY(-1px); box-shadow: 0 9px 22px rgba(21,35,63,.3); }
        .enter:active { transform: translateY(0); }
        .sub { color: var(--muted); font-size: 13px; margin-top: 14px; font-family: Arial, Helvetica, sans-serif; }
        .rule { width: 60px; height: 2px; background: var(--gold); margin: 26px auto 14px; border-radius: 2px; opacity: .8; }
        .foot { color: var(--muted); font-size: 12px; font-family: Arial, Helvetica, sans-serif; line-height: 1.7; }
        .foot a { color: var(--muted); text-decoration: underline; cursor: pointer; }
        .overlay { position: fixed; inset: 0; background: rgba(21,35,63,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
        .overlay.show { display: flex; }
        .card { background: #fff; border-radius: 14px; width: 100%; max-width: 360px; padding: 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); text-align: left; font-family: Arial, Helvetica, sans-serif; }
        .card h2 { color: var(--navy); font-size: 19px; margin-bottom: 4px; font-family: Georgia, serif; }
        .card p { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
        .card input { width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid #d8d8d8; border-radius: 9px; outline: none; transition: border-color .15s; }
        .card input:focus { border-color: var(--gold); }
        .row { display: flex; gap: 10px; margin-top: 14px; }
        .btn { flex: 1; padding: 13px; border-radius: 9px; border: none; cursor: pointer; font-weight: 700; font-size: 15px; }
        .btn-go { background: var(--navy); color: #fff; }
        .btn-go:disabled { opacity: .6; cursor: default; }
        .btn-cancel { background: #eee; color: #444; }
        .err { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 18px; }
    </style>
</head>

    <div class="overlay" id="gate">
        <div class="card">
            <h2>Khumotaka Register</h2>
            <p>Tsenya password ya gago. (Enter your password to continue.)</p>
            <input id="gpw" type="password" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')submitGate()">
            <div class="err" id="gerr"></div>
            <div class="row">
                <button class="btn btn-cancel" onclick="closeGate()">Tswala (Close)</button>
                <button class="btn btn-go" id="ggo" onclick="submitGate()">Tsena (Enter)</button>
            </div>
        </div>

    <script>
        var ADMIN_URL = 'https://vousucfboetqtppjywlg.supabase.co/functions/v1/farm-admin';
        var PUBKEY = 'sb_publishable_mOLSxtGicEchOdWIdPL6BA_aaybClra';
        (function () {
            try {
                var granted = localStorage.getItem('khumotaka_access') === 'granted';
                var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                if (granted && standalone) location.replace('app.html');
            } catch (e) {}
        })();
        function enterRegister() {
            if (localStorage.getItem('khumotaka_access') === 'granted') { location.href = 'app.html'; return; }
            document.getElementById('gerr').textContent = '';
            document.getElementById('gpw').value = '';
            document.getElementById('gate').classList.add('show');
            setTimeout(function () { document.getElementById('gpw').focus(); }, 50);
        }
        function closeGate() { document.getElementById('gate').classList.remove('show'); }
        function lockDevice() {
            try { localStorage.removeItem('khumotaka_access'); } catch (e) {}
            alert('Sediriswa se notletswe. O tla tlhoka password gape. (This device is locked. A password will be needed again.)');
        }
        async function submitGate() {
            var pw = (document.getElementById('gpw').value || '').trim();
            var err = document.getElementById('gerr');
            var go = document.getElementById('ggo');
            if (!pw) { err.textContent = 'Tsenya password. (Enter a password.)'; return; }
            go.disabled = true; go.textContent = 'Go a sekasekwa...'; err.textContent = '';
            try {
                var r = await fetch(ADMIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': PUBKEY, 'Authorization': 'Bearer ' + PUBKEY },
                    body: JSON.stringify({ action: 'login', password: pw })
                });
                var d = await r.json();
                if (d && d.ok) { localStorage.setItem('khumotaka_access', 'granted'); location.href = 'app.html'; }
                else { err.textContent = 'Password e phoso. (Wrong password.)'; go.disabled = false; go.textContent = 'Tsena (Enter)'; }
            } catch (e) { err.textContent = 'Network error. Leka gape. (Try again.)'; go.disabled = false; go.textContent = 'Tsena (Enter)'; }
        }
    </script>
